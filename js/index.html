<!DOCTYPE html>
<html>
<head>
    <title>PyTorch in the Browser</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script> -->
     <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>
</head>
<body>
    <h1>My PyTorch Model</h1>
    <p>Upload an image to run inference. The image is resized to 216x384 and converted to a [1, 3, 216, 384] tensor.</p>
    <input id="imageUpload" type="file" accept="image/*" />
    <button id="runBtn" disabled>Run Model</button>
    <pre id="status">Loading model...</pre>
    
    <script>
        const MODEL_PATH = './Ascent.onnx';
        const TARGET_HEIGHT = 216;
        const TARGET_WIDTH = 384;

        const imageUpload = document.getElementById('imageUpload');
        const runBtn = document.getElementById('runBtn');
        const status = document.getElementById('status');

        let session = null;
        let selectedFile = null;

        function updateRunButtonState() {
            runBtn.disabled = !(session && selectedFile);
        }

        function fileToImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(img);
                };
                img.onerror = (error) => {
                    URL.revokeObjectURL(objectUrl);
                    reject(error);
                };
                img.src = objectUrl;
            });
        }

        function imageToTensor(image) {
            const canvas = document.createElement('canvas');
            canvas.width = TARGET_WIDTH;
            canvas.height = TARGET_HEIGHT;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0, TARGET_WIDTH, TARGET_HEIGHT);

            const { data } = ctx.getImageData(0, 0, TARGET_WIDTH, TARGET_HEIGHT);
            const chwData = new Float32Array(1 * 3 * TARGET_HEIGHT * TARGET_WIDTH);
            const planeSize = TARGET_HEIGHT * TARGET_WIDTH;

            for (let y = 0; y < TARGET_HEIGHT; y++) {
                for (let x = 0; x < TARGET_WIDTH; x++) {
                    const pixelOffset = (y * TARGET_WIDTH + x) * 4;
                    const chwOffset = y * TARGET_WIDTH + x;

                    chwData[chwOffset] = data[pixelOffset] / 255.0;
                    chwData[planeSize + chwOffset] = data[pixelOffset + 1] / 255.0;
                    chwData[(2 * planeSize) + chwOffset] = data[pixelOffset + 2] / 255.0;
                }
            }

            return new ort.Tensor('float32', chwData, [1, 3, TARGET_HEIGHT, TARGET_WIDTH]);
        }

        async function initModel() {
            try {
                const sessionOptions = {
                    executionProviders: ['webgpu', 'wasm'] 
                };
                session = await ort.InferenceSession.create(MODEL_PATH, sessionOptions);
                status.textContent = `Model loaded. Input: ${session.inputNames[0]}, Output: ${session.outputNames[0]}`;
                updateRunButtonState();
            } catch (error) {
                status.textContent = `Failed to load model: ${error.message || error}`;
                console.error(error);
            }
        }

        imageUpload.addEventListener('change', (event) => {
            selectedFile = event.target.files && event.target.files[0] ? event.target.files[0] : null;
            status.textContent = selectedFile
                ? `Selected image: ${selectedFile.name}`
                : 'No image selected.';
            updateRunButtonState();
        });

        runBtn.addEventListener('click', async () => {
            if (!session || !selectedFile) {
                status.textContent = 'Model or image is missing.';
                return;
            }

            try {
                status.textContent = 'Preprocessing image...';
                const startTime = performance.now();
                const image = await fileToImage(selectedFile);
                console.log(`Image loaded in ${(performance.now() - startTime).toFixed(2)} ms`);
                const tensor = imageToTensor(image);
                console.log(`Image preprocessed in ${(performance.now() - startTime).toFixed(2)} ms`);

                status.textContent = 'Running model...';
                const inputName = session.inputNames[0];
                const outputName = session.outputNames[0];
                const results = await session.run({ [inputName]: tensor });
                console.log(`Model inference completed in ${(performance.now() - startTime).toFixed(2)} ms`);

                const labels = [
                    'A Main',
                    'A Lobby',
                    'A Wine',
                    'A Front',
                    'A Site',
                    'A Rafters',
                    'A Window',
                    'A Garden',
                    'Defenders',
                    'A Link',
                    'Mid Cubby',
                    'Mid Catwalk',
                    'Mid Courtyard',
                    'Mid Top',
                    'Attackers',
                    'Mid Link',
                    'B Lobby',
                    'B Main',
                    'B Site',
                    'B Back',
                    'Boathouse',
                    'Mid Bottom',
                    'Mid Pizza',
                    'Mid Market',
                    'A Generator',
                    'B Lane',
                    'B Stairs',
                    'B Logs',
                    'A Door',
                    'B Front',
                ]

                // sort labels alphabetically
                labels.sort();

                console.log(labels)

                const processed_results = []

                for (let i = 0; i < labels.length; i++) {
                    processed_results.push({
                        label: labels[i],
                        value: results[outputName].data[i],
                    });
                }

                processed_results.sort((a, b) => b.value - a.value);

                console.log('Model Output:', processed_results);
                status.textContent = `Inference complete. Output logged to console (${outputName}).`;
                status.textContent = `Inference complete. Top prediction: ${processed_results[0].label} (${processed_results[0].value.toFixed(4)})`;
            } catch (error) {
                status.textContent = `Failed to run inference: ${error.message || error}`;
                console.error(error);
            }
        });

        initModel();
    </script>
</body>
</html>
